default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.1
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.0
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.2  # The pyrefly version to use
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        pass_filenames: false
        language_version: python3.12
        additional_dependencies:
          - "aiida-core>=2.9.3"
          - "aiida-pseudo>=1.10.0"
          # Keep in sync with the pyoncvpsp rev pinned in pyproject.toml
          # TODO before merging: the pushed pyoncvpsp model-core-v2 commit
          - "pyoncvpsp @ file:///home/zadoks_a/Projects/pseudo-opt/code/pyoncvpsp-model-core-v2"
          - "pytest>=9.1.1"

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        stages: [commit-msg]
