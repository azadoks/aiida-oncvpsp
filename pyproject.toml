[project]
name = "aiida-oncvpsp"
version = "0.1.1"
description = "AiiDA plugin for the ONCVPSP pseudopotential generator"
readme = "README.md"
authors = [
    { name = "Austin Zadoks", email = "austin.zadoks@protonmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiida-core>=2.9.3",
    "aiida-pseudo>=1.8.0",
    "pyoncvpsp==0.1.0"
]

[tool.uv.sources]
pyoncvpsp = { git = "https://github.com/azadoks/pyoncvpsp", rev = "ad3d76901015a10decb44d5e446031819866d1d0" }

[tool.ruff]
line-length = 120

[tool.pyrefly]
project-includes = ["src/**/*.py"]
# Tests rely on dynamically typed AiiDA factories and fixtures
project-excludes = ["tests/**"]

[project.entry-points.'aiida.calculations']
'oncvpsp.oncvpsp' = 'aiida_oncvpsp.calculations:OncvpspCalculation'

[project.entry-points.'aiida.parsers']
'oncvpsp.oncvpsp' = 'aiida_oncvpsp.parsers:OncvpspParser'

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyrefly>=0.55.0",
    "pytest>=8.0",
    "ruff>=0.14.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
