[project]
name = "aiida-oncvpsp"
version = "0.1.1"
description = "AiiDA plugin for the ONCVPSP pseudopotential generator"
readme = "README.md"
authors = [
    { name = "Austin Zadoks", email = "austin.zadoks@protonmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiida-core>=2.9.3",
    "aiida-pseudo>=1.10.0",
    "pyoncvpsp==0.1.0"
]

[tool.uv.sources]
pyoncvpsp = { git = "https://github.com/azadoks/pyoncvpsp", rev = "564f90617e532c1ce9dbdb1377b4b80dcd71f7bf" }

[tool.ruff]
line-length = 120

[tool.pyrefly]
project-includes = ["src/**/*.py"]
# Tests rely on dynamically typed AiiDA factories and fixtures
project-excludes = ["tests/**"]

[project.entry-points.'aiida.calculations']
'oncvpsp.oncvpsp' = 'aiida_oncvpsp.calculations:OncvpspCalculation'

[project.entry-points.'aiida.parsers']
'oncvpsp.oncvpsp' = 'aiida_oncvpsp.parsers:OncvpspParser'

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
